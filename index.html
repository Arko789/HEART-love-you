<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You ❤</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--rose:#ff4d6d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#060208;overflow:hidden;font-family:Arial,'Segoe UI',sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#060208;color:#ffd6dd;cursor:pointer;transition:opacity 1s;text-align:center;padding:24px}
#gate.off{opacity:0;pointer-events:none}
#gate .h{font-size:72px;color:var(--rose);animation:beat 1.2s infinite}
#gate p{margin:0;letter-spacing:.12em;font-size:15px;opacity:.85}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(1)}}
#mute{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;background:#1a0a10;color:#ffd6dd;border:1px solid #5a1c2c;border-radius:20px;padding:8px 14px;font-size:14px;display:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate"><div class="h">❤</div><p>TAP TO OPEN</p></div>
<button id="mute">🔊</button>
<audio id="a" src="music.mp3" loop preload="auto"></audio>

<!-- text geometry, generated by heart.py -->
<script src="layout.js"></script>
<script>
(function(){
const FONT="Arial,'Segoe UI','Noto Sans',sans-serif";
const TICK=16,DURATION=10,ANIM=42,LIFT=34;
const BGC=[6/255,2/255,8/255],FLASH=[1,.78,.78];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=v=>Math.max(0,Math.min(1,v));
const hx=c=>'#'+c.map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>a.map((p,i)=>p+(b[i]-p)*t),dim=(c,t)=>c.map(v=>v*t);
let W=0,H=0,dpr=1,k=1,ORDER=[],idx=0,acc=0,RATE=0,spawning=true,shim=0,running=false;
const CY=typeof LAYOUTS!=='undefined'?LAYOUTS.cy:0;

function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;k=Math.min(W/720,H/680)}
function logic(now){
  if(spawning){acc+=RATE;while(acc>=1&&idx<ORDER.length){acc--;ORDER[idx++].f=0}if(idx>=ORDER.length)spawning=false}
  let busy=false;
  for(let i=0;i<idx;i++){const p=ORDER[i];if(p.f<ANIM){p.f++;busy=true}}
  if(!spawning&&!busy&&now-shim>140){shim=now;ORDER[Math.floor(Math.random()*ORDER.length)].sh=now+260}
}
function draw(now){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(k*dpr,0,0,k*dpr,W/2*dpr,(H/2+CY*k)*dpr);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<idx;i++){
    const p=ORDER[i],u=clamp(p.f/ANIM),e=1-Math.pow(1-u,3),c=p.c,x=p.x,y=-p.y,s=p.s;
    const px=x+p.dx*(1-e),py=y-(1-e)*LIFT;
    ctx.font=`bold ${s}px ${FONT}`;
    ctx.fillStyle=hx(mix(BGC,dim(c,.3),e));ctx.fillText(p.t,x+2,y+3);
    ctx.font=`bold ${s+1}px ${FONT}`;
    ctx.fillStyle=hx(mix(BGC,dim(c,.2),e*e));ctx.fillText(p.t,px,py);
    ctx.font=`bold ${s}px ${FONT}`;
    const col=u>=1?(p.sh>now?mix(c,FLASH,.6):c)
      :mix(mix(BGC,c,Math.pow(e,1.5)),FLASH,.75*Math.sin(Math.PI*clamp((u-.55)/.45)));
    ctx.fillStyle=hx(col);ctx.fillText(p.t,px,py);
  }
}
let last=0,accT=0;
function frame(t){
  if(!last)last=t;accT+=Math.min(100,t-last);last=t;
  while(accT>=TICK){accT-=TICK;logic(t)}
  draw(t);requestAnimationFrame(frame);
}
function start(){
  if(running)return;running=true;resize();
  const src=W<700?LAYOUTS.narrow:LAYOUTS.wide;
  ORDER=src.map(p=>({...p,f:0,sh:0}));
  RATE=ORDER.length/(DURATION*1000/TICK);
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);

const gate=document.getElementById('gate'),au=document.getElementById('a'),mute=document.getElementById('mute');
gate.addEventListener('click',()=>{
  gate.classList.add('off');
  au.play().catch(()=>{});mute.style.display='block';
  start();
});
mute.addEventListener('click',()=>{au.muted=!au.muted;mute.textContent=au.muted?'🔇':'🔊'});
})();
</script>
</body>
</html>
